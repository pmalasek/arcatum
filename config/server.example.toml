# arcatum-server configuration. Copy to /etc/arcatum/server.toml and adjust.
# Missing fields fall back to built-in defaults (see pkg/config.Default), but the file
# itself is mandatory: without one the server refuses to start rather than come up on
# plain HTTP with unencrypted secrets.
#
# Where it is looked for, in order: ./server.toml, then /etc/arcatum/server.toml.
# (-config overrides both.) A binary started from a directory without a server.toml of
# its own therefore uses the installed configuration — debugging a production build on
# the server works with production PKI, not with something half-configured.
#
# The install lives in /opt/arcatum: binaries, PKI, script definitions, runner builds.
# /central_backup/arcatum holds nothing but what the server itself writes — private keys
# have no business sitting on the same volume as the repositories they unlock.

[server]
listen    = "0.0.0.0:8443"                  # API / web listen address
scripts   = "/opt/arcatum/scripts"          # dir with script definitions
data_dir  = "/central_backup/arcatum/data"  # DB and runtime state
timezone  = "Europe/Prague"                 # default TZ for schedules without one
log_level = "info"                          # debug | info | warn | error

# The web UI: a separate, plain-HTTP listener where people log in with a username and a
# password. Runners keep authenticating with certificates on [server] listen above — a
# machine is installed once, while a browser certificate would have to be exported and
# imported for every person and every computer they use.
#
# On the first start the server creates the "admin" account and prints its generated
# password into the log once. Reset a forgotten one with:
#   arcatum-server -passwd admin
# Leave listen empty to switch the web UI off entirely.
[web]
listen      = "0.0.0.0:8080"
session_ttl = "12h"                         # inactivity window; slides while the UI is in use
# Only set this when a reverse proxy terminates HTTPS in front of this listener: it tells
# the browser to send the session cookie over HTTPS only, which on a plain-HTTP listener
# means nobody can log in at all.
# secure_cookie = true

[storage]
backup_dir = "/central_backup/arcatum"      # where backup data is stored

# How long the stdout/stderr logs of a finished run are kept. A failed run's log is the
# one somebody reads, so it outlives a successful one. Accepts days ("14d") or a Go
# duration ("36h"); "0" keeps logs forever.
#
# Backup data is never deleted by this — only logs.
log_retention_success = "14d"
log_retention_failed  = "90d"

# mTLS. Generate the files with: deploy/gen-certs.sh -H <server-ip-or-dns> <runner-id>...
# All three paths must be set together. Without them the server speaks plain HTTP and
# does NOT authenticate callers — development only.
[tls]
# ca_cert = "/opt/arcatum/pki/ca.pem"
# cert    = "/opt/arcatum/pki/server.pem"
# key     = "/opt/arcatum/pki/server.key"

# Key used to sign job dispatches; runners verify it with the matching .pub file.
# Required whenever [tls] is set.
[signing]
# key = "/opt/arcatum/pki/dispatch-signing.key"
# During a rotation, list the *private* key being replaced here: the server co-signs the
# published key set with every key it holds, which is what lets a runner still on the old
# key accept the set that introduces the new one.
# previous_keys = ["/opt/arcatum/pki/dispatch-signing-old.key"]

# Encrypts instance secrets in the database. Required whenever [tls] is set — without
# it credentials sit in arcatum.db in plaintext. Back this key up: losing it makes
# every stored secret unreadable.
[secrets]
# master_key = "/opt/arcatum/pki/secrets-master.key"
# During a rotation, keep the previous key here until everything has been re-encrypted
# (web UI → "Klíče" → přešifrovat, or POST /api/v1/secrets/rekey).
# previous_keys = ["/opt/arcatum/pki/secrets-master-old.key"]

# Plain-HTTP listener for installing and enrolling runners. A host with no certificate
# yet cannot reach the mTLS port at all, so "curl … | sh" talks to this one. It serves
# only install.sh, the runner binaries, ca.pem, the signing public key, and the
# enrollment endpoints — none of which is secret. Leave listen empty to disable.
[bootstrap]
# listen   = "0.0.0.0:80"
# dist_dir = "/opt/arcatum/dist"           # arcatum-runner-linux-amd64, …
# api_url  = "https://172.24.0.60:8443"    # written into the generated runner.toml
# ca_key   = "/opt/arcatum/pki/ca.key"     # signs approved enrollment requests
# During a CA rotation this is the *incoming* authority, while [tls] ca_cert is a bundle of
# every authority still trusted. Keep the server's own certificate under the outgoing
# authority until every runner has adopted the bundle (see README: Rotace klíčů).
# ca_cert  = "/opt/arcatum/pki/ca.pem"

# Off-site copy. Everything the server stores is pushed to a second machine with
# rsync over ssh, so this server stops being the only place the backups exist.
#
# The transfer is one-way and read-only on this side: a broken link turns into a
# visible backlog that catches up by itself, never into a failed backup. Prepare the
# replica first — see docs/production.md ("Off-site replika").
[replica]
# enabled     = true
# host        = "172.26.0.2"                      # reachable over the WireGuard tunnel
# user        = "arcatum"
# path        = "/data"                           # destination root on the replica
# port        = 22
# ssh_key     = "/opt/arcatum/pki/replica-ssh.key"
# known_hosts = "/opt/arcatum/pki/replica-known_hosts"   # empty disables host key checking
#
# bwlimit = 0        # KiB/s, 0 = unlimited. Keeps replication from competing with backups.
# timeout = "2h"     # ceiling for one item; a stalled rsync is killed and retried later
#
# Propagate deletions, so retention here reaches the replica too. max_delete is the
# guard that makes this safe: a pass that would remove more files than this aborts and
# leaves the replica alone, which is what stands between an unmounted backup_dir and an
# emptied off-site copy. Required whenever mirror is set.
# mirror     = true
# max_delete = 100
#
# Also replicate the PKI, the signing key, the secrets master key and a consistent
# snapshot of arcatum.db. This is what makes the replica a complete restore point —
# without the keys the repositories over there cannot be opened at all. It also makes
# the replica as sensitive as this server: keep /data mode 0700, owned by a dedicated
# account, and restrict its authorized_keys entry.
# include_keys = true
#
# sweep_every = "1h"   # full reconciliation pass (catches deletions and anything missed)
# probe_every = "5m"   # reachability check, so an outage is visible before the next backup
