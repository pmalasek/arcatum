# arcatum-runner configuration (runner.toml), installed on each backed-up host.
# install.sh writes `server` from the URL the installer was fetched from, so the
# operator normally doesn't edit this by hand.

[runner]
server        = "https://172.24.0.60:8443"  # where to check in (arcatum-server)
enroll_server = "http://172.24.0.60"         # plain-HTTP bootstrap, used only to obtain
                                             # a certificate on first start
poll_interval = "30s"                        # how often the runner checks in
data_dir      = "/var/lib/arcatum-runner"    # identity + temp dispatch files

# Client mTLS. The certificate's common name must equal this runner's id (the
# runner_id used in instances) — the server identifies the runner by it.
# All three paths must be set together.
#
# If cert/key do not exist yet, the runner generates its own key on first start and
# enrols: it sends a certificate request to enroll_server and waits until an operator
# approves it in the web UI. The private key never leaves this host.
[tls]
# ca_cert = "/var/lib/arcatum-runner/pki/ca.pem"
# cert    = "/var/lib/arcatum-runner/pki/runner.pem"
# key     = "/var/lib/arcatum-runner/pki/runner.key"

# Server's public key for verifying job signatures. Required whenever [tls] is set;
# without it the runner would execute whatever it is handed.
[signing]
# public_key = "/var/lib/arcatum-runner/pki/dispatch-signing.pub"
